apiVersion: v2
name: mock-app
description: Mock of the ccf-app chart (mock-api + mock-ui) for CCF release automation
type: application

# Chart version. Bump on any change to the chart, including appVersion.
version: 0.2.3

# Version of mock-api deployed by default (api.image.tag falls back to it).
# Starts at 0.0.0; ccf-bump sets real versions once the mocks release.
appVersion: "0.1.1"

home: https://github.com/compliance-framework
sources:
  - https://github.com/compliance-framework/mock-api
  - https://github.com/compliance-framework/mock-ui
  - https://github.com/compliance-framework/mock-helm-charts
