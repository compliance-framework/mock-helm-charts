name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-helm.yml@59e8ff8221b5363d99bcdbc3d837fb4f561839a6
    with:
      make-targets: helm.test.app helm.test.agent
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  notify:
    needs: [ci]
    if: failure()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@59e8ff8221b5363d99bcdbc3d837fb4f561839a6
    with:
      workflows-ref: 59e8ff8221b5363d99bcdbc3d837fb4f561839a6
    permissions:
      actions: read
      contents: read
    secrets: inherit
