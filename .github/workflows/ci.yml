name: ci

on:
  pull_request:
    # labeled/unlabeled: release-checks re-reads the release:major-approved label.
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-helm.yml@ca987fae431ad10a65315b87ae87a5a579f817a9 # v1.3.2
    with:
      make-targets: helm.test.app helm.test.agent
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@ca987fae431ad10a65315b87ae87a5a579f817a9 # v1.3.2
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@ca987fae431ad10a65315b87ae87a5a579f817a9 # v1.3.2
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
