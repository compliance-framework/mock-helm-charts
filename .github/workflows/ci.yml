name: ci

on:
  pull_request:
    # labeled/unlabeled: release-checks re-reads the release:major-approved label.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-helm.yml@084cc5d5ee6a40455f84b4f3108cfb254654ae28
    with:
      make-targets: helm.test.app helm.test.agent
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@084cc5d5ee6a40455f84b4f3108cfb254654ae28
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: failure()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@084cc5d5ee6a40455f84b4f3108cfb254654ae28
    with:
      workflows-ref: 084cc5d5ee6a40455f84b4f3108cfb254654ae28
    permissions:
      actions: read
      contents: read
    secrets: inherit
