name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Multi-chart repo: release-please tags <chart>-vX.Y.Z and release-helm.yml picks the
    # chart from the tag's component (defaults: charts-dir charts, registry
    # oci://ghcr.io/compliance-framework/helm-charts).
    uses: compliance-framework/workflows/.github/workflows/release-helm.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    permissions:
      contents: read
      packages: write
    secrets: inherit
