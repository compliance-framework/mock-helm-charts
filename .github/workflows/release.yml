name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Multi-chart repo: release-please tags <chart>-vX.Y.Z and release-helm.yml picks the
    # chart from the tag's component (defaults: charts-dir charts, registry
    # oci://ghcr.io/compliance-framework/helm-charts).
    uses: compliance-framework/workflows/.github/workflows/release-helm.yml@7b55019ed36050a57eb8273f6a67fd4b2395adb0 # v1.5.1
    permissions:
      contents: read
      packages: write
    secrets: inherit
