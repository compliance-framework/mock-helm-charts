---
# Source: mock-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccf-mock-agent
  labels:
    app.kubernetes.io/name: mock-agent
    app.kubernetes.io/instance: ccf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-agent
      app.kubernetes.io/instance: ccf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-agent
        app.kubernetes.io/instance: ccf
    spec:
      containers:
        - name: agent
          image: "ghcr.io/compliance-framework/mock-agent:snapshot"
          imagePullPolicy: IfNotPresent
